name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the workcenter toolchain (same script as the cloud environment)
        run: sudo env REQUIRE_FREEROUTING=1 ./install.sh
      - name: Verify
        run: make verify
